      position: fixed;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(
        145deg,
        #fff36a,
        #ffd21c 45%,
        #d99b00
      );
      border: 2px solid #b77b00;
      box-shadow:
        inset 0 2px 2px rgba(255,255,255,0.7),
        0 3px 5px rgba(0,0,0,0.25);
      pointer-events: none;
      transform-style: preserve-3d;
      z-index: 1000;
    }

    .coin::after {
      content: "$";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      font-weight: bold;
      color: #9a6800;
      text-shadow: 1px 1px rgba(255,255,255,0.4);
    }

    @keyframes coinFly {
      0% {
        transform:

        opacity: 0;
      }
    }

    .coin.fly {

    }
