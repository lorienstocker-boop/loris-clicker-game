<!DOCTYPE html>
<html>
<head>
  <title>Loris fun clicker game!</title>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }
    .container {
      text-align: center;
      background: white;
      padding: 30px 50px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    button {
      font-size: 18px;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Score: <span id="score">0</span></h1>
    <button onclick="increaseScore()">click me!</button>
  </div>

  <button onclick="extraScore()">
  +1 point-per-click (Cost: 5)
</button>

<script>
  let score = 0;
  let pointsPerClick = 1;
  const upgradeCost = 5;

  function increaseScore() {
    score += pointsPerClick;
    document.getElementById('score').textContent = score;
  }

  function extraScore() {
    if (score >= upgradeCost) {
      score -= upgradeCost;
      pointsPerClick++;
      document.getElementById('score').textContent = score;
      alert('Upgrade bought! You get +1 more point per click.');
    } else {
      alert('Not enough points to buy the upgrade.');
    }
  }
</script>

</body>
</html>
