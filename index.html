<!DOCTYPE html>
<html>
<head>
  <title>loris fun clicker game!</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;
      background: #f0f0f0;

      overflow: hidden;
    }

    .container {
      position: relative;

      text-align: center;

      background: white;
      padding: 30px 50px;

      border-radius: 10px;

      box-shadow: 0 0 10px rgba(0,0,0,0.1);

      z-index: 10;
    }

    button {
      font-size: 18px;

      padding: 10px 20px;

      cursor: pointer;

      margin: 10px 5px 0 5px;
    }

    /*
      COINS
    */

    .coin {
      position: fixed;

      width: 24px;
      height: 24px;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #fff36a,
          #ffd21c 45%,
          #d99b00
        );

      border: 2px solid #b77b00;

      box-shadow:
        inset 0 2px 2px rgba(255,255,255,0.7),
        0 3px 5px rgba(0,0,0,0.25);

      pointer-events: none;

      z-index: 1000;

      /*
        This makes the coin rotate in 3D.
      */
      transform-style: preserve-3d;

      /*
        Prevents the coin from appearing as
        a weird inline element.
      */
      display: block;
    }

    .coin::after {
      content: "$";

      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      font-size: 14px;

      font-weight: bold;

      color: #9a6800;

      text-shadow:
        1px 1px rgba(255,255,255,0.4);

      pointer-events: none;
    }



    @keyframes coinFly {

      0% {
        transform:
          translate3d(0, 0, 0)
          rotateX(0deg)
          rotateY(0deg)
          rotateZ(0deg)
          scale(1);

        opacity: 1;
      }

      45% {
        transform:
          translate3d(
            calc(var(--x) * 0.35),
            var(--midY),
            0
          )
          rotateX(var(--rx))
          rotateY(var(--ry))
          rotateZ(var(--rz))
          scale(1.15);

        opacity: 1;
      }

      75% {
        transform:
          translate3d(
            calc(var(--x) * 0.75),
            var(--floorY),
            0
          )
          rotateX(var(--rx2))
          rotateY(var(--ry2))
          rotateZ(var(--rz2))
          scale(0.95);

        opacity: 1;
      }

      90% {
        transform:
          translate3d(
            var(--x),
            calc(var(--floorY) - 10px),
            0
          )
          rotateX(var(--rx3))
          rotateY(var(--ry3))
          rotateZ(var(--rz3))
          scale(0.9);

        opacity: 1;
      }

      100% {
        transform:
          translate3d(
            var(--x),
            var(--floorY),
            0
          )
          rotateX(var(--rx3))
          rotateY(var(--ry3))
          rotateZ(var(--rz3))
          scale(0.2);

        opacity: 0;
      }
    }

    .coin.fly {
      animation:
        coinFly 900ms cubic-bezier(.2,.7,.3,1) forwards;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>
      score:
      <span id="score">0</span>
    </h1>

    <button
      id="clickButton"
      onclick="increaseScore()">
      click me!
    </button>

    <br>

    <button
      id="upgradeBtn"
      onclick="extraScore()">
      +1 point-per-click (cost: 5)
    </button>

    <button
      id="upgradeBtn2"
      onclick="extraScoreX2()">
      +50 point-per-click (cost: 100)
    </button>

    <button
      id="upgradeBtn3"
      onclick="extraScoreX5()">
      at this point you're about to see some BIG numbers!
      (cost: 50000)
    </button>

  </div>


  <script>

    /*
      GAME VARIABLES
    */

    let score = 0;

    let pointsPerClick = 1;

    let upgradeCost = 5;
    let upgradeCost2 = 100;
    let upgradeCost3 = 50000;




    function updateScore() {

      document.getElementById("score").textContent = score;

    }




    function increaseScore() {

      score += pointsPerClick;

      updateScore();

      createCoins();

    }


    

    function extraScore() {

      if (score >= upgradeCost) {

        score -= upgradeCost;

        pointsPerClick += 1;

        upgradeCost =
          Math.round(upgradeCost * 1.5);

        updateScore();

        document.getElementById("upgradeBtn").textContent =
          `+1 point-per-click (cost: ${upgradeCost})`;

      } else {

        alert(
          "not enough points to buy the upgrade. :("
        );

      }

    }



    function extraScoreX2() {

      if (score >= upgradeCost2) {

        score -= upgradeCost2;

        pointsPerClick += 50;

        upgradeCost2 =
          Math.round(upgradeCost2 * 1.5);

        updateScore();

        document.getElementById("upgradeBtn2").textContent =
          `+50 point-per-click (cost: ${upgradeCost2})`;

      } else {

        alert(
          "not enough points to buy the upgrade. :("
        );

      }

    }




    function extraScoreX5() {

  if (score >= upgradeCost3) {

    score -= upgradeCost3;

    pointsPerClick += 6500;

    upgradeCost3 = Math.round(upgradeCost3 * 10);

    updateScore();

    document.getElementById("upgradeBtn3").textContent =
      `BIG upgrade! (+6500 per click) (cost: ${upgradeCost3})`;

  } else {

    alert("not enough points to buy the upgrade. :(");

  }

}

        coin.style.animationDelay =

        document.body.appendChild(coin);
