<!DOCTYPE html>
<html>
<head>
  <title>loris fun clicker game!</title>

  <style>
    body, html {
      height: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }

    .container {
      text-align: center;
      background: white;
      padding: 30px 50px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    button {
      font-size: 18px;
      padding: 10px 20px;
      cursor: pointer;
      margin: 10px 5px 0 5px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>score: <span id="score">0</span></h1>

    <button onclick="increaseScore()">
      click me!
    </button>

    <br>

    <button id="upgradeBtn" onclick="extraScore()">
      +1 point-per-click (cost: 5)
    </button>

    <button id="upgradeBtn2" onclick="extraScoreX2()">
      +50 point-per-click (cost: 100)
    </button>

  </div>

  <script>
    let score = 0;
    let pointsPerClick = 1;

    let upgradeCost = 5;
    let upgradeCost2 = 100;


    function increaseScore() {
      score += pointsPerClick;

      document.getElementById('score').textContent = score;
    }



    function extraScore() {

      if (score >= upgradeCost) {

        score -= upgradeCost;

        pointsPerClick += 1;

        upgradeCost = Math.round(upgradeCost * 1.5);

        document.getElementById('score').textContent = score;

        document.getElementById('upgradeBtn').textContent =
          `+1 point-per-click (cost: ${upgradeCost})`;

      } else {

        alert('not enough points to buy the upgrade. :(');

      }
    }



    function extraScoreX2() {

      if (score >= upgradeCost2) {

        score -= upgradeCost2;

        pointsPerClick += 50;

        upgradeCost2 = Math.round(upgradeCost2 * 5);

        document.getElementById('score').textContent = score;

        document.getElementById('upgradeBtn2').textContent =
          `+50 point-per-click (cost: ${upgradeCost2})`;

      } else {

        alert('Not enough points to buy the upgrade. :(');

      }
    }

  </script>

</body>
</html>
