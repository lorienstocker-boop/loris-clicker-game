<!DOCTYPE html>
<html>
<head>
  <title>Simple Clicker</title>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }
    .container {
      text-align: center;
      background: white;
      padding: 30px 50px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    button {
      font-size: 18px;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Score: <span id="score">0</span></h1>
    <button onclick="increaseScore()">Click me!</button>
  </div>

  <script>
    let score = 0;
    function increaseScore() {
      score++;
      document.getElementById('score').textContent = score;
    }
  </script>

</body>
</html>
